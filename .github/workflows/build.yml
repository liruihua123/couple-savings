# ============================================================
# 云端自动出包：推送代码到 GitHub → 自动构建 debug APK → 下载安装
# 你不需要在本机装 Android Studio / SDK，全部在 GitHub 服务器上完成。
# 触发方式：① 推送到 main/master 分支自动跑；② 在 Actions 页点 "Run workflow" 手动跑。
# ============================================================
name: Build Debug APK

on:
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK（命令行工具 + Platform 34 + Build-Tools）
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandline-tools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 下载 Gradle 8.5（直接用，不依赖本地包装器）
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "GRADLE=$PWD/gradle-8.5/bin/gradle" >> $GITHUB_ENV

      - name: 构建 debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x "$GRADLE"
          "$GRADLE" assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: couple-savings-apk
          path: app/build/outputs/apk/debug/*.apk
